<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Furniro — Blog</title>
    <meta name="description" content="Furniro journal and interior ideas" />
    <link rel="stylesheet" href="./dist/output.css" />
  </head>
  <body data-page="blog">
    <div data-app-shell>
      <main>
        <section class="bg-[#F9F1E7]">
          <div class="mx-auto max-w-[1180px] px-5 py-14 lg:px-8">
            <div class="text-xs uppercase tracking-[.25em] text-black/40">
              Journal
            </div>
            <h1 class="mt-3 text-4xl font-semibold">Ideas for better rooms</h1>
            <p class="mt-3 max-w-[620px] text-sm leading-6 text-black/50">
              Stories, styling notes and practical ideas for a more thoughtful
              home.
            </p>
          </div>
        </section>
        <section class="mx-auto max-w-[1180px] px-5 py-12 lg:px-8">
          <div class="flex flex-wrap gap-3">
            <input
              id="blog-search"
              class="form-input max-w-[320px]"
              placeholder="Search articles"
            /><select id="blog-filter" class="form-input w-[180px]">
              <option>All</option>
              <option>Interior</option>
              <option>Tips</option>
              <option>Bedroom</option>
              <option>Living</option>
            </select>
          </div>
          <div
            id="blog-list"
            class="mt-8 grid gap-6 md:grid-cols-2 lg:grid-cols-3"
          ></div>
        </section>
      </main>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
