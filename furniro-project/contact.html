<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Furniro — Contact</title>
    <meta name="description" content="Contact Furniro" />
    <link rel="stylesheet" href="./dist/output.css" />
  </head>
  <body data-page="contact">
    <div data-app-shell>
      <main>
        <section class="bg-[#F9F1E7]">
          <div class="mx-auto max-w-[1180px] px-5 py-14 lg:px-8">
            <div class="text-xs uppercase tracking-[.25em] text-black/40">
              Get in touch
            </div>
            <h1 class="mt-3 text-4xl font-semibold">Contact Us</h1>
            <p class="mt-3 max-w-[620px] text-sm leading-6 text-black/50">
              Questions about a product, order or styling? Send a message and
              our team will get back to you.
            </p>
          </div>
        </section>
        <section
          class="mx-auto grid max-w-[1180px] gap-12 px-5 py-14 lg:grid-cols-[.8fr_1.2fr] lg:px-8"
        >
          <div class="rounded-xl bg-[#F9F1E7] p-8">
            <div class="text-lg font-semibold">Furniro Studio</div>
            <div class="mt-6 grid gap-6 text-sm">
              <div>
                <div class="text-black/40">Address</div>
                <div class="mt-1">
                  400 University Drive Suite 200 Coral Gables, FL 33134
                </div>
              </div>
              <div>
                <div class="text-black/40">Phone</div>
                <div class="mt-1">+1 555 123 4567</div>
              </div>
              <div>
                <div class="text-black/40">Email</div>
                <div class="mt-1">hello@furniro.example</div>
              </div>
            </div>
          </div>
          <form id="contact-form" class="grid gap-4" novalidate>
            <label class="form-label"
              >Your name<input class="form-input" name="name" required /></label
            ><label class="form-label"
              >Email<input
                class="form-input"
                type="email"
                name="email"
                required /></label
            ><label class="form-label"
              >Subject<input
                class="form-input"
                name="subject"
                required /></label
            ><label class="form-label"
              >Message<textarea
                class="form-input h-40 resize-none py-3"
                name="message"
                required
              ></textarea>
            </label>
            <div class="flex items-center gap-4">
              <button class="btn-primary" type="submit">Send Message</button
              ><a class="btn-outline" href="shop.html">Browse Shop</a>
            </div>
            <div
              id="contact-success"
              class="hidden rounded bg-emerald-50 p-3 text-sm text-emerald-700"
            ></div>
          </form>
        </section>
      </main>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
