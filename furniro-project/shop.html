<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Furniro — Shop</title>
    <meta name="description" content="Shop Furniro interior furniture">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body data-page="shop">
    <div data-app-shell>
      <main>
        <section class="bg-[#F9F1E7]">
          <div class="mx-auto max-w-[1180px] px-5 py-14 text-center lg:px-8">
            <div class="text-xs uppercase tracking-[.25em] text-black/40">Shop</div>
            <h1 class="mt-3 text-4xl font-semibold">All Products</h1>
            <p class="mt-3 text-sm text-black/45">Explore the collection and find a piece that belongs in your home.</p>
          </div>
        </section>
        <div class="mx-auto max-w-[1180px] px-5 py-10 lg:px-8">
          <div class="flex flex-wrap items-end justify-between gap-4">
            <div class="flex flex-wrap gap-2"><button id="filter-open" class="btn-outline">Filter</button><input id="shop-search" class="form-input w-[220px]" placeholder="Search something here"></div>
            <div class="flex flex-wrap items-center gap-2"><span id="results-label" class="mr-2 text-xs text-black/45"></span><select id="shop-show" class="form-input w-[100px]">
                <option value="8">Show 8</option>
                <option value="4">Show 4</option>
                <option value="12">Show 12</option>
              </select><select id="shop-sort" class="form-input w-[180px]">
                <option value="default">Sort by</option>
                <option value="price-asc">Price low to high</option>
                <option value="price-desc">Price high to low</option>
                <option value="name">Name</option>
              </select><button id="view-grid" class="icon-btn border border-black/10">▦</button><button id="view-list" class="icon-btn border border-black/10">☷</button></div>
          </div>
          <div id="shop-filters" class="mt-6 hidden rounded-xl bg-[#F9F1E7] p-6">
            <div class="grid gap-6 md:grid-cols-[1.3fr_1fr]">
              <div>
                <div class="text-sm font-semibold">Category</div>
                <div id="category-filters" class="mt-3 flex flex-wrap gap-2"></div>
              </div>
              <div>
                <div class="flex items-center justify-between text-sm font-semibold"><span>Max price</span><span id="shop-max-label">₫15.000.000</span></div><input id="shop-max-price" class="mt-4 w-full" type="range" min="150000" max="15000000" value="15000000" step="50000">
              </div>
            </div>
          </div>
          <div id="shop-grid" class="mt-8 grid grid-cols-2 gap-x-3 gap-y-6 md:grid-cols-3 lg:grid-cols-4"></div>
          <div id="pagination" class="mt-10 flex justify-center gap-2"></div>
        </div>
      </main>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
